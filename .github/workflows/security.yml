name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.detect.outputs.go }}
      run_heavy: ${{ steps.detect.outputs.run_heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: ./.github/scripts/classify-changes.sh

  # Secrets can hide in any file, including documentation, so this job always runs.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: true
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan history for secrets
        run: gitleaks git --redact --verbose --exit-code 1

  govulncheck:
    name: govulncheck
    needs: detect
    if: needs.detect.outputs.go == 'true' && needs.detect.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: security-govulncheck-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
      - run: govulncheck ./...

  gosec:
    name: gosec
    needs: detect
    if: needs.detect.outputs.go == 'true' && needs.detect.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: security-gosec-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: true
      - run: go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
      - name: Run gosec (report)
        run: gosec -fmt sarif -out gosec.sarif ./...
        continue-on-error: true
      - name: Upload SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: gosec.sarif
      - name: Fail on high severity findings
        run: gosec -severity high -confidence high ./...

  scorecard:
    name: scorecard
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif