name: Release Dry Run

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "scripts/build-release.sh"
      - "Dockerfile"
      - ".github/workflows/release*.yml"
  push:
    branches: [main]
    paths:
      - "scripts/build-release.sh"
      - "Dockerfile"

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: release-dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: Build all release binaries
        env:
          VERSION: "dry-run"
        run: ./scripts/build-release.sh
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/mage2mcp.sbom.spdx.json
      - name: Generate checksums
        run: cd dist && sha256sum ./* > checksums.txt
      - name: Verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/mage2mcp-server_linux_amd64
          test -s dist/mage2mcp-worker_linux_amd64
          test -s dist/mage2mcp-admin_linux_amd64
          test -s dist/mage2mcp-server_darwin_arm64
          test -s dist/mage2mcp.sbom.spdx.json
          grep -q "mage2mcp-server_linux_amd64" dist/checksums.txt
          echo "release artifacts verified"
      - name: Build container image (no push)
        run: docker build --build-arg VERSION=dry-run -t mage2mcp:dry-run .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dry-run
          path: dist
          retention-days: 7
