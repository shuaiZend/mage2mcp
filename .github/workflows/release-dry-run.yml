name: Release Dry Run

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "scripts/build-release.sh"
      - "Dockerfile"
      - ".github/workflows/release*.yml"
  push:
    branches: [main]
    paths:
      - "scripts/build-release.sh"
      - "Dockerfile"

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: release-dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: true
      - name: Build all release binaries
        env:
          VERSION: "dry-run"
        run: ./scripts/build-release.sh
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/mage2mcp.sbom.spdx.json
      - name: Generate checksums
        run: cd dist && sha256sum ./* > checksums.txt
      - name: Verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/mage2mcp-server_linux_amd64
          test -s dist/mage2mcp-worker_linux_amd64
          test -s dist/mage2mcp-admin_linux_amd64
          test -s dist/mage2mcp-server_darwin_arm64
          test -s dist/mage2mcp.sbom.spdx.json
          grep -q "mage2mcp-server_linux_amd64" dist/checksums.txt
          echo "release artifacts verified"
      - name: Build container image (no push)
        run: docker build --build-arg VERSION=dry-run -t mage2mcp:dry-run .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: dist
          retention-days: 7
