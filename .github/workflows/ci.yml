name: CI (manual pre-release)

# Local-first workflow: day-to-day commits are verified with scripts/local-ci.sh.
# GitHub runs this workflow only when a maintainer dispatches it before a release.
on:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run the Docker/Magento end-to-end smoke test"
        type: boolean
        default: true
      go_version:
        description: "Go toolchain for the test job"
        type: string
        default: "1.27.x"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Verify module integrity
        run: |
          go mod verify
          git diff --exit-code go.mod go.sum
      - name: Vet
        run: go vet ./...

      - name: No test may disappear
        shell: bash
        # A deleted test leaves valid Go code that compiles and passes, so the
        # suite stays green while the coverage it provided is gone. Compare the
        # test names against the base branch and fail on a removal. The checkout
        # above uses fetch-depth 0, so the base ref is present.
        run: |
          base="origin/${GITHUB_BASE_REF:-main}"
          bash scripts/check-test-inventory.sh --base "$base" --head HEAD
      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run
      - name: Test with race detector
        run: |
          mapfile -t packages < <(go list ./... | grep -v '/test/e2e/')
          go test -race -covermode=atomic -coverprofile=coverage.out "${packages[@]}"
      - name: Enforce coverage floor
        shell: bash
        run: |
          total="$(go tool cover -func=coverage.out | tail -n 1 | awk '{print $3}' | tr -d '%')"
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t < 70) exit 1 }' || {
            echo "::error::total coverage ${total}% is below the 70% floor"
            exit 1
          }
      - name: Enforce per-scope coverage floors
        shell: bash
        run: |
          # The testing strategy sets per-scope targets that nothing enforced, so a
          # drop in the security or protocol layer was invisible while the total
          # stayed above 70%. The floors below are the measured level, rounded down:
          # they are a ratchet, so coverage cannot fall, and the distance to the
          # documented target is recorded in docs/development/testing-strategy.md
          # rather than left to look met.
          set -euo pipefail
          fail=0
          check() { # scope floor
            go test -race -count=1 -covermode=atomic -coverprofile=scope.out "$1" >/dev/null
            got="$(go tool cover -func=scope.out | tail -n 1 | awk '{print $3}' | tr -d '%')"
            echo "$1 coverage: ${got}% (floor $2%)"
            awk -v g="$got" -v f="$2" 'BEGIN { if (g + 0 < f + 0) exit 1 }' || {
              echo "::error::$1 coverage ${got}% is below its ${2}% floor"
              fail=1
            }
          }
          check ./internal/security/... 85
          check ./internal/core/... 84
          check ./internal/mcp/... 78
          exit "$fail"
      - name: Documentation gates
        run: |
          npm ci
          npm run lint:md
          npm run lint:links
          npm run test:contracts
      - name: Actions are SHA-pinned
        shell: bash
        run: |
          if grep -rEn 'uses:[[:space:]]+[^#]+@(v[0-9]|main|master)' .github/workflows; then
            echo "::error::Every action must be pinned to a 40-character commit SHA."
            exit 1
          fi


  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mage2mcp
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: mage2mcp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mage2mcp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          cache: true
      - name: Storage integration tests
        env:
          MAGE2MCP_TEST_DATABASE_URL: "postgres://mage2mcp:test-password@127.0.0.1:5432/mage2mcp?sslmode=disable"
        run: go test -race -count=1 ./internal/storage/...

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: mage2mcp:ci
          build-args: VERSION=ci
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=mage2mcp-docker
          cache-to: type=gha,mode=max,scope=mage2mcp-docker
      - name: Container smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name mage2mcp-ci -p 18080:8080 \
            -e MAGE2MCP_AUTH_ENABLED=false \
            -e MAGE2MCP_DEV_INSECURE=true \
            -e MAGE2MCP_LISTEN=0.0.0.0:8080 \
            mage2mcp:ci
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            docker logs mage2mcp-ci || true
            echo "::error::container did not become healthy"
            exit 1
          fi
          curl -fsS http://127.0.0.1:18080/readyz
          curl -fsS http://127.0.0.1:18080/metrics -o /tmp/mage2mcp-metrics.txt
          grep -q mage2mcp_build_info /tmp/mage2mcp-metrics.txt
          user="$(docker inspect -f '{{.Config.User}}' mage2mcp-ci)"
          echo "${user}" | grep -Eq '^(nonroot(:nonroot)?|65532(:65532)?)$'
      - name: Clean up
        if: always()
        run: docker rm -f mage2mcp-ci || true

  e2e:
    name: e2e
    if: inputs.run_e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}
          cache: true
      - name: End-to-end Magento smoke test
        run: ./test/e2e/run.sh
      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml ps || true
          docker compose -f docker-compose.yml logs --tail=100 || true

  gate:
    name: ci-gate
    needs: [verify, integration, docker, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every non-skipped job to succeed
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed="$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')"
          if [ -n "$failed" ]; then
            echo "::error::Failed or cancelled jobs: $failed"
            exit 1
          fi
          echo "All jobs passed or were skipped as not applicable."
