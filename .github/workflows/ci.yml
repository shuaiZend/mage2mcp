name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.detect.outputs.go }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: detect
        shell: bash
        run: |
          if [ -f go.mod ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Markdown lint
        run: npm run lint:md
      - name: Internal link check
        run: npm run lint:links
      - name: Design contract check
        run: npm run test:contracts

  integration:
    name: integration
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mage2mcp
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: mage2mcp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mage2mcp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: Run storage integration tests
        env:
          MAGE2MCP_TEST_DATABASE_URL: "postgres://mage2mcp:test-password@127.0.0.1:5432/mage2mcp?sslmode=disable"
        run: go test -race -count=1 ./internal/storage/...

  go:
    name: go
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Verify module integrity
        run: |
          go mod verify
          git diff --exit-code go.mod go.sum
      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run
      - name: Build
        run: go build ./...
      - name: Test with race detector
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Enforce coverage floor
        shell: bash
        run: |
          total="$(go tool cover -func=coverage.out | tail -n 1 | awk '{print $3}' | tr -d '%')"
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t < 70) exit 1 }' || {
            echo "::error::total coverage ${total}% is below the 70% floor"
            exit 1
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.go-version }}
          path: coverage.out
          if-no-files-found: ignore

  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require Signed-off-by on every commit
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          failed=0
          for commit in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            if ! git log -1 --format=%B "$commit" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit $commit is missing a Signed-off-by line (DCO)."
              failed=1
            fi
          done
          exit "$failed"

  actions-pinned:
    name: actions-pinned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject tag-pinned actions
        shell: bash
        run: |
          set -euo pipefail
          if grep -rEn 'uses:[[:space:]]+[^#]+@(v[0-9]|main|master)' .github/workflows; then
            echo "::error::Every action must be pinned to a 40-character commit SHA."
            exit 1
          fi
          echo "All actions are SHA-pinned."

  docker:
    name: docker
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image
        run: docker build --build-arg VERSION=ci -t mage2mcp:ci .
      - name: Run the container and probe it
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name mage2mcp-ci -p 18080:8080 \
            -e MAGE2MCP_AUTH_ENABLED=false \
            -e MAGE2MCP_DEV_INSECURE=true \
            -e MAGE2MCP_LISTEN=0.0.0.0:8080 \
            mage2mcp:ci
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            docker logs mage2mcp-ci || true
            echo "::error::container did not become healthy"
            exit 1
          fi
          curl -fsS http://127.0.0.1:18080/healthz
          curl -fsS http://127.0.0.1:18080/readyz
          curl -fsS http://127.0.0.1:18080/metrics -o /tmp/mage2mcp-metrics.txt
          grep -q mage2mcp_tool_calls_total /tmp/mage2mcp-metrics.txt
          user="$(docker inspect -f '{{.Config.User}}' mage2mcp-ci)"
          echo "container user: ${user}"
          echo "${user}" | grep -Eq '^(nonroot(:nonroot)?|65532(:65532)?)$'
          echo "docker smoke test passed"
      - name: Container logs
        if: always()
        run: docker logs mage2mcp-ci || true
      - name: Clean up
        if: always()
        run: docker rm -f mage2mcp-ci || true

  external-links:
    name: external-links
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check external links (non-blocking)
        run: find . -name '*.md' -not -path './node_modules/*' -not -path './.git/*' -print0 | xargs -0 -n1 ./node_modules/.bin/markdown-link-check -q -c .markdown-link-check.external.json
