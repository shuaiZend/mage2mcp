name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Everything that compiles or executes third-party code runs here, with a
  # read-only token. Nothing in this job can publish, sign, or mint an OIDC token.
  verify:
    name: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: true
      - name: Verify the tag is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Verify module integrity
        run: go mod verify
      - name: Test
        run: go test -race ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          govulncheck ./...
      - name: Build release binaries
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/build-release.sh
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/mage2mcp.sbom.spdx.json
      - name: Generate third-party notices
        run: |
          go run github.com/google/go-licenses@v1.6.0 save ./... --save_path=dist/licenses --force
          tar -czf dist/THIRD_PARTY_NOTICES.tar.gz -C dist licenses
          rm -rf dist/licenses
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist
          if-no-files-found: error

  # This job never compiles or executes repository code. It receives the
  # verified artifacts and only signs, attests, and publishes them.
  publish:
    name: publish
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Generate checksums
        shell: bash
        run: cd dist && sha256sum ./* > checksums.txt
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Sign artifacts (keyless)
        shell: bash
        run: |
          set -euo pipefail
          for f in dist/*; do
            cosign sign-blob --yes --bundle "${f}.bundle" "$f"
          done
      - name: Set up QEMU
        if: hashFiles('Dockerfile') != ''
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        if: hashFiles('Dockerfile') != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Container metadata
        id: meta
        if: hashFiles('Dockerfile') != ''
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/shuaizend/mage2mcp
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Log in to GHCR
        if: hashFiles('Dockerfile') != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push container image
        id: build
        if: hashFiles('Dockerfile') != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
      - name: Sign container image (keyless)
        if: hashFiles('Dockerfile') != ''
        run: cosign sign --yes "ghcr.io/shuaizend/mage2mcp@${{ steps.build.outputs.digest }}"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true