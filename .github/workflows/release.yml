name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: Verify module integrity
        run: go mod verify
      - name: Run tests before release
        run: go test ./...
      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            out="dist/mage2mcp_${os}_${arch}"
            if [ "$os" = "windows" ]; then out="${out}.exe"; fi
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "$out" ./cmd/server
          done
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/mage2mcp.sbom.spdx.json
      - name: Generate checksums
        shell: bash
        run: cd dist && sha256sum ./* > checksums.txt
      - uses: sigstore/cosign-installer@v3
      - name: Sign artifacts (keyless)
        shell: bash
        run: |
          set -euo pipefail
          for f in dist/*; do
            case "$f" in
              dist/checksums.txt) continue ;;
            esac
            cosign sign-blob --yes --bundle "${f}.bundle" "$f"
          done
      - name: Set up QEMU
        if: hashFiles('Dockerfile') != ''
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        if: hashFiles('Dockerfile') != ''
        uses: docker/setup-buildx-action@v3
      - name: Container metadata
        id: meta
        if: hashFiles('Dockerfile') != ''
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/shuaizend/mage2mcp
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push container image
        id: build
        if: hashFiles('Dockerfile') != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
      - name: Sign container image (keyless)
        if: hashFiles('Dockerfile') != ''
        run: cosign sign --yes "ghcr.io/shuaizend/mage2mcp@${{ steps.build.outputs.digest }}"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
