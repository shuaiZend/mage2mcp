# Release-notes configuration for GitHub's automatically generated notes.
# `.github/workflows/release.yml` publishes with `generate_release_notes: true`,
# so this file decides how merged pull requests are grouped on the Releases page.
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
        - breaking
    - title: Features
      labels:
        - enhancement
        - feature
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Documentation
      labels:
        - documentation
        - docs
    - title: CI, build, and tooling
      labels:
        - ci
        - build
        - tooling
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"