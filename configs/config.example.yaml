# mage2mcp example configuration.
#
# Copy to config.yaml and fill in ${VAR} references. Never commit real
# credentials: every credential field is a reference to an environment
# variable or secret-manager entry.
server:
  listen: "127.0.0.1:8080"
  public_url: "https://mcp.example.com"
  shutdown_grace: 10s
  max_body_bytes: 1048576

auth:
  # Authentication is required outside loopback development. The gateway
  # refuses to start with auth disabled on a non-loopback listener.
  enabled: true
  issuer: "${MAGE2MCP_AUTH_ISSUER}"
  audience: "${MAGE2MCP_AUTH_AUDIENCE}"
  jwks_url: "${MAGE2MCP_AUTH_JWKS_URL}"

log:
  level: "info"
  format: "json"

# Optional tool surfaces. Write tools stay disabled until the confirmation
# middleware ships; enable only in a controlled environment.
tools:
  writes: false

# Optional PostgreSQL state store. Without it, audit is in memory and lost on
# restart (development only).
database:
  url: "${MAGE2MCP_DATABASE_URL}"
  max_conns: 10


# Optional cross-source bindings used by unified tools. Each binding names one
# Magento, one Cloudflare, and one GA4 instance; all three must be enabled.
bindings:
  - id: "store-us-analytics"
    magento: "store-us"
    cloudflare: "zone-us"
    ga4: "giztop"

datasources:
  magento:
    enabled: false
    instances:
      - id: "store-us"
        endpoint: "https://shop.example.com"
        store_code: "default"
        # Credential forms:
        #   bearer:<integration-access-token>            (recommended)
        #   oauth1:<key>:<secret>:<token>:<token-secret>
        #   admin:<username>:<password>                   (mints and refreshes an
        #     admin bearer token automatically; a password may contain colons)
        #
        # Security caveat: an admin token inherits the whole ACL role of the
        # account, which is far more powerful than an integration token. Use a
        # dedicated API-only admin with a least-privilege role, never a human
        # administrator. The password stays in process memory and is never
        # logged or persisted. With 2FA enabled the token endpoint is refused,
        # so prefer bearer: or oauth1: there.
        credential: "${MAGENTO_US_CREDENTIAL}"
  cloudflare:
    enabled: false
    instances:
      - id: "zone-us"
        account_id: "${CLOUDFLARE_ACCOUNT_ID}"
        zone_id: "${CLOUDFLARE_ZONE_ID}"
        credential: "${CLOUDFLARE_API_TOKEN}"
  ga4:
    enabled: false
    instances:
      - id: "giztop"
        property_id: "354542598"
        credential: "${GA4_SERVICE_ACCOUNT}"
