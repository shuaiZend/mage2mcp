# Local development stack. Production deployments should use a managed
# PostgreSQL and Redis, a secret manager, and Cloudflare Tunnel for ingress.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mage2mcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: mage2mcp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mage2mcp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MAGE2MCP_LISTEN: "0.0.0.0:8080"
      MAGE2MCP_AUTH_ISSUER: ${MAGE2MCP_AUTH_ISSUER:?set MAGE2MCP_AUTH_ISSUER}
      MAGE2MCP_AUTH_AUDIENCE: ${MAGE2MCP_AUTH_AUDIENCE:?set MAGE2MCP_AUTH_AUDIENCE}
      MAGE2MCP_AUTH_JWKS_URL: ${MAGE2MCP_AUTH_JWKS_URL:?set MAGE2MCP_AUTH_JWKS_URL}
      MAGE2MCP_DATABASE_URL: "postgres://mage2mcp:${POSTGRES_PASSWORD}@postgres:5432/mage2mcp?sslmode=disable"
      MAGE2MCP_REDIS_ADDR: "redis:6379"
      MAGE2MCP_REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - ./config.yaml:/etc/mage2mcp/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/mage2mcp", "-help"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    entrypoint: ["/usr/local/bin/mage2mcp-worker"]
    command: ["-config", "/etc/mage2mcp/config.yaml"]
    environment:
      MAGE2MCP_DATABASE_URL: "postgres://mage2mcp:${POSTGRES_PASSWORD}@postgres:5432/mage2mcp?sslmode=disable"
      MAGE2MCP_REDIS_ADDR: "redis:6379"
      MAGE2MCP_REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - ./config.yaml:/etc/mage2mcp/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  redis-data:
