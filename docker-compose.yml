# Local development stack: `docker compose up --build`.
#
# Defaults are development-only: authentication is disabled, passwords are
# fixed placeholders, and the port is bound to loopback. Never expose this
# stack to a network. For a production-shaped stack use:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# and provide the Access and password values from a secret manager.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mage2mcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mage2mcp-dev}
      POSTGRES_DB: mage2mcp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mage2mcp"]
      interval: 5s
      timeout: 3s
      retries: 10


  server:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MAGE2MCP_LISTEN: "0.0.0.0:8080"
      MAGE2MCP_AUTH_ENABLED: ${MAGE2MCP_AUTH_ENABLED:-false}
      MAGE2MCP_DEV_INSECURE: ${MAGE2MCP_DEV_INSECURE:-true}
      MAGE2MCP_AUTH_ISSUER: ${MAGE2MCP_AUTH_ISSUER:-}
      MAGE2MCP_AUTH_AUDIENCE: ${MAGE2MCP_AUTH_AUDIENCE:-}
      MAGE2MCP_AUTH_JWKS_URL: ${MAGE2MCP_AUTH_JWKS_URL:-}
      MAGE2MCP_DATABASE_URL: "postgres://mage2mcp:${POSTGRES_PASSWORD:-mage2mcp-dev}@postgres:5432/mage2mcp?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/mage2mcp-server", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    entrypoint: ["/usr/local/bin/mage2mcp-worker"]
    command: ["-config", "/etc/mage2mcp/config.yaml"]
    environment:
      MAGE2MCP_DATABASE_URL: "postgres://mage2mcp:${POSTGRES_PASSWORD:-mage2mcp-dev}@postgres:5432/mage2mcp?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
